revolte:
  version: '1'
  project: fyfuyf
  appName: prev
  env:
    preview:
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: node_modules/next/dist/bin/next
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
            variables:
              NODE_ENV: production
              PORT: '8080'
    qa:
      branch: qa
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: node_modules/next/dist/bin/next
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
    staging:
      branch: staging
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: node_modules/next/dist/bin/next
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
    production:
      branch: main
      services:
        rid_1:
          name: prev
          type: WEB_SERVICE
          entryPoint: node_modules/next/dist/bin/next
          specifications:
            cpu: 2
            memory: 2
            storage: 50
            autoScaling:
              replica:
                min: 1
                max: 3
          properties:
            health: /health
            port: 8080
            loadBalancerMode: shared
